<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sokoban</title>
    <style>
      :root {
        color-scheme: dark;
        --ground: #11131a;
        --panel: #1d2230;
        --line: #2c3444;
        --text: #c3c9d8;
        --muted: #7d8699;
        --bright: #e8edf7;
        --accent: #63a8e0;
        --gold: #d7b36a;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        padding: 16px;
        box-sizing: border-box;
        background:
          radial-gradient(
            ellipse at 50% 30%,
            rgba(99, 168, 224, 0.07),
            transparent 60%
          ),
          var(--ground);
        color: var(--text);
        font:
          14px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      /* Author-origin `display` beats the browser's `[hidden]` rule whatever
         the specificity, so an inactive screen needs hiding explicitly. */
      [hidden] {
        display: none !important;
      }
      .screen {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .keys {
        flex: 0 0 auto;
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }
      kbd {
        font: inherit;
        color: var(--text);
        padding: 0 4px;
        border: 1px solid var(--line);
        border-radius: 3px;
      }

      /* Title and finale share one card. */
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 560px;
        width: 100%;
        text-align: center;
      }
      .game-title {
        margin: 0;
        font-size: clamp(40px, 9vw, 76px);
        line-height: 1;
        letter-spacing: 0.18em;
        /* Letter spacing trails the last letter too; this keeps it centred. */
        margin-right: -0.18em;
        text-transform: uppercase;
        color: var(--bright);
        text-shadow:
          0 0 24px rgba(99, 168, 224, 0.35),
          0 3px 0 #2c3444;
      }
      .tagline,
      .eyebrow {
        margin: 0;
        color: var(--muted);
      }
      .eyebrow {
        color: var(--gold);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-size: 12px;
      }
      /* Tight, and eating into the card's gaps, so its reserved line stays
         small while it is hidden. */
      .prompt {
        margin: -4px 0;
        line-height: 1;
        color: var(--gold);
      }

      /* Every change of view — a screen, a level, the overlay — crossfades
         from the old one; see transitionView in src/host/index.ts. */
      ::view-transition-group(root),
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.1s;
        animation-timing-function: ease-out;
      }

      /* A crate pushed onto a goal — the whole game in three cells. */
      .motif {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }
      .motif span {
        width: 28px;
        height: 28px;
        box-sizing: border-box;
      }
      .motif .player {
        border-radius: 50%;
        background: var(--accent);
        transform: scale(0.75);
      }
      .motif .crate {
        border: 3px solid var(--gold);
        border-radius: 4px;
        background:
          linear-gradient(
            45deg,
            transparent 44%,
            var(--gold) 44% 56%,
            transparent 56%
          ),
          linear-gradient(
            -45deg,
            transparent 44%,
            var(--gold) 44% 56%,
            transparent 56%
          ),
          #3a3020;
        animation: push 2.8s ease-in-out infinite;
      }
      .motif .goal {
        border: 2px dashed var(--muted);
        border-radius: 4px;
      }
      /* Pushed, a rest, then eased back — a loop with no snap. */
      @keyframes push {
        0%,
        15% {
          transform: translateX(0);
        }
        45%,
        65% {
          transform: translateX(6px);
        }
        90%,
        100% {
          transform: translateX(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .motif .crate {
          animation: none;
        }
      }

      .menu {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 240px;
        margin-top: 0;
        margin-bottom: 10px;
      }
      /* The title menu keeps one height whatever it offers — Continue and
         Select Level come and go — with its items sat at the bottom, so the
         card above never moves. */
      #title-menu .menu {
        box-sizing: border-box;
        height: 140px;
        justify-content: flex-end;
      }
      /* A lone item — a fresh game's New Game — sits in the middle instead. */
      #title-menu .menu:has(> .menu-item:only-child) {
        justify-content: center;
      }
      /* While the levels load: the menu's own box, holding three dots that
         wait a moment before showing, so a quick load never flashes them. */
      .loader {
        display: flex;
        gap: 6px;
        align-self: center;
        margin-block: auto;
        opacity: 0;
        animation: loader-in 0.3s ease-out 0.15s forwards;
      }
      .loader span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--muted);
        animation: loader-dot 1.2s ease-in-out infinite;
      }
      .loader span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .loader span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes loader-in {
        to {
          opacity: 1;
        }
      }
      @keyframes loader-dot {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }
      /* The first menu after loading fades in where the loader was. */
      .menu.entering .menu-item {
        animation: menu-enter 0.3s ease-out both;
      }
      @keyframes menu-enter {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        @keyframes menu-enter {
          from {
            opacity: 0;
          }
        }
      }
      .menu-item {
        font: inherit;
        font-size: 16px;
        letter-spacing: 0.08em;
        color: var(--muted);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 8px 20px;
        cursor: pointer;
        transition:
          color 0.2s ease-out,
          background 0.2s ease-out,
          border-color 0.2s ease-out;
      }
      .menu-item.selected {
        color: var(--bright);
        background: var(--panel);
        border-color: var(--accent);
      }
      /* The arrow is on every item, hidden until selected, so selecting one
         never moves its label; the invisible twin on the right balances it,
         keeping the label centred. */
      .menu-item::before,
      .menu-item::after {
        content: '▸ ';
        color: var(--accent);
        opacity: 0;
      }
      .menu-item::after {
        content: ' ▸';
        visibility: hidden;
      }
      .menu-item::before {
        transition: opacity 0.2s ease-out;
      }
      .menu-item.selected::before {
        opacity: 1;
      }

      /* Level select: a card per level, its board in miniature. */
      #levels {
        justify-content: flex-start;
        align-items: stretch;
        max-width: 1000px;
        width: 100%;
        margin: 0 auto;
      }
      #levels h1 {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--bright);
      }
      #levels-grid {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .level-grid {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        align-content: start;
        gap: 12px;
        /* Room for the selected card's ring at the scroll edges. */
        padding: 2px;
      }
      .level-card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font: inherit;
        color: inherit;
        text-align: left;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px;
        cursor: pointer;
        /* The selection ring is always there, only transparent, so moving the
           selection fades one card's ring out as the next one's fades in. */
        box-shadow: 0 0 0 1px transparent;
        transition:
          border-color 0.2s ease-out,
          box-shadow 0.2s ease-out;
      }
      .level-card.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }
      /* Dimmed, but its frame left alone, so the selection still shows. */
      .level-card.locked canvas,
      .level-card.locked .name {
        opacity: 0.35;
      }
      /* The miniature is the game's own renderer at card size, so the canvas
         gets a fixed box to measure itself against rather than a fluid one. */
      .level-card canvas {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        background: #0c0e14;
        border-radius: 4px;
      }
      .level-card .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--bright);
      }
      .level-card .number {
        color: var(--gold);
      }
      .level-card .status {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
      }
      .level-card .padlock {
        flex: 0 0 auto;
      }
      /* Playing a locked level: the lock and its label blink twice. */
      .level-card .status.denied {
        animation: denied 0.45s ease-in-out 2;
      }
      @keyframes denied {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.2;
        }
      }

      /* The board. */
      #game {
        position: relative;
        justify-content: stretch;
      }
      #hud {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 4px 24px;
        width: 100%;
        max-width: 900px;
      }
      #hud-level {
        color: var(--bright);
      }
      #hud-level .count {
        color: var(--muted);
      }
      #hud-stats {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      #hud-stats b {
        font-weight: normal;
        color: var(--text);
      }
      /* A zero basis keeps the canvas's backing-store size out of layout:
         with `auto` the basis follows the canvas's width/height attributes,
         so every render that resized the backing store nudged the board's
         box, and the next render re-measured a slightly different size. */
      #board {
        flex: 1 1 0;
        width: 100%;
        max-width: 900px;
        min-height: 0;
      }
      #game-footer {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px 16px;
      }
      #overlay {
        position: absolute;
        inset: -16px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 12, 18, 0.72);
        backdrop-filter: blur(2px);
      }
      .panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        min-width: 280px;
        padding: 28px 32px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        text-align: center;
      }
      .panel h2 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--bright);
      }
      .panel .menu {
        margin-top: 12px;
      }

      .stats {
        display: flex;
        gap: 28px;
        margin: 8px 0 0;
      }
      .stats div {
        display: flex;
        flex-direction: column;
      }
      .stats dt {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .stats dd {
        margin: 0;
        font-size: 22px;
        color: var(--bright);
        font-variant-numeric: tabular-nums;
      }

      /* The finale. */
      #finished .card {
        max-width: 640px;
      }
      .results-wrap {
        width: 100%;
        max-height: 40vh;
        overflow: auto;
        margin-top: 8px;
      }
      .results {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      .results th,
      .results td {
        padding: 6px 12px;
        border-bottom: 1px solid var(--line);
        text-align: right;
      }
      .results th:nth-child(2),
      .results td:nth-child(2) {
        text-align: left;
      }
      .results thead th {
        color: var(--muted);
        font-weight: normal;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .results td:first-child {
        color: var(--muted);
      }
      .results tfoot td {
        color: var(--bright);
        border-bottom: none;
      }
    </style>
  </head>
  <body>
    <section id="title" class="screen">
      <div class="card">
        <div class="motif" aria-hidden="true">
          <span class="player"></span><span class="crate"></span
          ><span class="goal"></span>
        </div>
        <h1 class="game-title">Sokoban</h1>
        <p class="tagline">Push every crate onto a goal.</p>
        <!-- Always laid out, only shown when asked, so the card never jumps. -->
        <p class="prompt" id="title-prompt" style="visibility: hidden">
          Start over? Your current progress will be lost.
        </p>
        <!-- Until the levels load: the menu's box, so nothing moves when the
             menu arrives. -->
        <div id="title-menu">
          <div class="menu">
            <div class="loader" role="status" aria-label="Loading">
              <span></span><span></span><span></span>
            </div>
          </div>
        </div>
      </div>
      <p class="keys">
        <kbd>↑</kbd> <kbd>↓</kbd> choose · <kbd>Enter</kbd> select
      </p>
    </section>

    <section id="levels" class="screen" hidden>
      <h1>Select Level</h1>
      <div id="levels-grid"></div>
      <p class="keys">
        <kbd>←↑↓→</kbd>/<kbd>WASD</kbd> choose · <kbd>Enter</kbd> play ·
        <kbd>Esc</kbd> back
      </p>
    </section>

    <section id="game" class="screen" hidden>
      <header id="hud">
        <span id="hud-level"></span>
        <span id="hud-stats"></span>
      </header>
      <canvas id="board"></canvas>
      <footer id="game-footer">
        <p class="keys">
          <kbd>←↑↓→</kbd>/<kbd>WASD</kbd> move · <kbd>Z</kbd> undo ·
          <kbd>R</kbd> restart · <kbd>Esc</kbd> menu
        </p>
      </footer>
      <div id="overlay" hidden>
        <div class="panel">
          <p class="eyebrow" id="overlay-eyebrow"></p>
          <h2 id="overlay-title"></h2>
          <div id="overlay-body"></div>
          <div id="overlay-menu"></div>
        </div>
      </div>
    </section>

    <section id="finished" class="screen" hidden>
      <div class="card">
        <p class="eyebrow">All levels complete</p>
        <h1 class="game-title">Well done</h1>
        <p class="tagline" id="finished-summary"></p>
        <div class="results-wrap">
          <table class="results" id="finished-results"></table>
        </div>
        <div id="finished-menu"></div>
      </div>
    </section>

    <script type="module" src="/src/host/index.ts"></script>
  </body>
</html>
