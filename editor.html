<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sokoban — editor</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        box-sizing: border-box;
        background: #11131a;
        color: #c3c9d8;
        font:
          14px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      section.mode {
        flex: 1 1 auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 16px;
        min-height: 0;
      }
      /* Author-origin `display` beats the browser's `[hidden]` rule whatever
         the specificity, so the inactive mode needs hiding explicitly. */
      section.mode[hidden] {
        display: none;
      }
      main,
      aside {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
        min-width: 0;
      }
      aside {
        overflow-y: auto;
      }
      /* The board canvas is sized to the zoomed level and this box scrolls it,
         so zooming in pans with the browser's own scrollbars — the same deal
         the sheet palette gets below. */
      .board-view {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
      }
      canvas.board {
        display: block;
        touch-action: none;
        cursor: crosshair;
      }
      /* The canvas is sized to the zoomed sheet and this box scrolls it, so
         zooming in pans with the browser's own scrollbars. */
      #palette-view {
        flex: 0 0 auto;
        height: 200px;
        overflow: auto;
        border: 1px solid #2c3444;
        border-radius: 4px;
      }
      #sheet-palette {
        display: block;
        touch-action: pan-x pan-y;
        cursor: crosshair;
      }
      /* The two visibility switches read as one group, set apart from what the
         tools do: they change what the preview shows, not what a click does. */
      #preview-options .shows {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-left: auto;
        color: #7d8699;
        font-size: 12px;
      }
      /* The mode buttons are a property of the place tool rather than tools of
         their own, so the row says what they apply to. */
      #preview-options .caption {
        color: #7d8699;
        font-size: 12px;
      }
      .zoom-level {
        min-width: 3em;
        text-align: center;
        color: #7d8699;
        font-size: 12px;
      }
      /* Pushed to the end of its row: it changes how the board is looked at,
         not what is in it. */
      .zoom {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-left: auto;
      }
      h2 {
        margin: 0;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #7d8699;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .modes {
        flex: 0 0 auto;
        border-bottom: 1px solid #2c3444;
        padding-bottom: 12px;
      }
      /* Publishing is neither panel's: it ships the level and the tiles at
         once, so it sits in the top bar, away from the mode buttons. */
      .publish {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-left: 20px;
      }
      .publish input[type='text'] {
        flex: 0 1 12em;
      }
      /* Empty until something is exported, and the column gap would otherwise
         leave a hole in the top bar. */
      #publish-report:empty {
        display: none;
      }
      /* Pushed away from the mode switch: it resets both panels, so it should
         not sit where a mode button is expected. */
      button.danger {
        margin-left: auto;
        color: #7d8699;
      }
      button.danger:hover {
        color: #e07a7a;
        border-color: #e07a7a;
      }
      button {
        font: inherit;
        color: inherit;
        background: #1d2230;
        border: 1px solid #2c3444;
        border-radius: 4px;
        padding: 5px 10px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: #4b5570;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button[aria-pressed='true'] {
        background: #2f3a52;
        border-color: #63a8e0;
        color: #e8edf7;
      }
      .swatch {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 6px;
        border-radius: 2px;
        vertical-align: baseline;
      }
      input[type='number'] {
        font: inherit;
        color: inherit;
        width: 4.5em;
        background: #1d2230;
        border: 1px solid #2c3444;
        border-radius: 4px;
        padding: 4px 6px;
      }
      input[type='text'] {
        font: inherit;
        color: inherit;
        flex: 1 1 8em;
        min-width: 0;
        background: #1d2230;
        border: 1px solid #2c3444;
        border-radius: 4px;
        padding: 4px 6px;
      }
      /* The picker is a swatch, so it gets no padding of its own — what it
         shows is the colour, not a field with a colour in it. */
      input[type='color'] {
        width: 3em;
        height: 1.9em;
        padding: 0;
        background: #1d2230;
        border: 1px solid #2c3444;
        border-radius: 4px;
        cursor: pointer;
      }
      input[type='file'] {
        font: inherit;
        color: inherit;
        width: 100%;
        font-size: 12px;
      }
      textarea {
        font: inherit;
        color: inherit;
        flex: 1 1 auto;
        min-height: 160px;
        resize: vertical;
        white-space: pre;
        background: #0c0e14;
        border: 1px solid #2c3444;
        border-radius: 4px;
        padding: 8px;
      }
      .report p {
        margin: 0 0 4px;
      }
      .report .ok {
        color: #6faf6a;
      }
      .report .error {
        color: #e07a7a;
      }
      .report .warning {
        color: #d7b36a;
      }
      /* The ground is the level's, not the skin's, but it sits with the ink
         because what it is for is what shows through a transparent tile. */
      #ground .state {
        margin-left: auto;
        color: #7d8699;
        font-size: 12px;
      }
      #ground .clear {
        flex: 0 0 auto;
        padding: 5px 8px;
        color: #7d8699;
      }
      #ground .clear:hover:enabled {
        color: #e07a7a;
      }
      /* A colour's hex is there to be read and copied, so it is spelled out
         next to the chip rather than left to a tooltip. */
      .swatches {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      /* Colours mode has the room for columns, and a palette is read as a
         block; the skin sidebar gets the same rows in one column. */
      #palette-swatches {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        align-content: start;
        gap: 4px;
      }
      /* The panel is about colour, so here the colour is the thing and the hex
         is the caption. The skin sidebar keeps the small chip: there the hex is
         what is wanted and the colour only has to be recognisable. */
      #palette-swatches .chip {
        width: 40px;
        height: 26px;
      }
      .swatch-row {
        display: flex;
        gap: 4px;
        min-width: 0;
      }
      .swatch-row > button.swatch {
        display: flex;
        align-items: center;
        gap: 8px;
        text-align: left;
        flex: 1 1 auto;
        min-width: 0;
      }
      .swatch-row .chip {
        display: block;
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        border: 1px solid #2c3444;
        border-radius: 2px;
      }
      .swatch-row .hex {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .swatch-action {
        flex: 0 0 auto;
        padding: 5px 8px;
        color: #7d8699;
      }
      .swatch-action:hover {
        color: #e8edf7;
      }
      .swatch-empty {
        margin: 0;
        color: #7d8699;
      }
      /* A hex field is six digits and a hash, so it does not need to grow the
         way a name field does. */
      input.hex {
        flex: 0 1 8em;
      }
      #palette-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #palette-list .palette-row > button {
        display: flex;
        align-items: center;
        gap: 8px;
        text-align: left;
        width: 100%;
        min-width: 0;
      }
      #palette-list .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* The first few colours, so a palette is recognisable before it is
         opened — pushed right, because the name is what is read first. */
      #palette-list .strip {
        display: flex;
        gap: 2px;
        margin-left: auto;
        flex: 0 0 auto;
      }
      #palette-list .strip .chip {
        display: block;
        width: 9px;
        height: 14px;
        border-radius: 1px;
      }
      #palette-list .count {
        flex: 0 0 auto;
        color: #7d8699;
        font-size: 12px;
      }
      /* Deleting a palette cannot be undone — the stack is the document's — so
         the control reads as the destructive one it is. */
      #colors-mode .clear {
        flex: 0 0 auto;
        padding: 5px 8px;
        color: #7d8699;
      }
      #colors-mode .clear:hover:enabled {
        color: #e07a7a;
      }
      #skin-palette {
        font: inherit;
        color: inherit;
        width: 100%;
        background: #1d2230;
        border: 1px solid #2c3444;
        border-radius: 4px;
        padding: 4px 6px;
      }
      #skin-palette-report:empty {
        display: none;
      }
      #role-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #role-list .role-row {
        display: flex;
        gap: 4px;
      }
      #role-list .role-row > button[data-role] {
        display: flex;
        align-items: center;
        gap: 8px;
        text-align: left;
        flex: 1 1 auto;
        min-width: 0;
      }
      #role-list .clear {
        flex: 0 0 auto;
        padding: 5px 8px;
        color: #7d8699;
      }
      #role-list .clear:hover {
        color: #e07a7a;
      }
      /* The glyph carries the role's own ink as its colour, set inline, so this
         only has to leave room for it. */
      #role-list .ink {
        flex: 0 0 auto;
        padding: 5px 8px;
      }
      #role-list .role-heading {
        margin: 8px 0 2px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #7d8699;
      }
      #role-list .role-heading:first-child {
        margin-top: 0;
      }
      /* A canvas, because the thumbnail has to show the role's ink and the only
         honest way to do that is the same tinting the export does. */
      #role-list .tile {
        display: block;
        width: 24px;
        height: 24px;
        flex: 0 0 auto;
        border: 1px solid #2c3444;
        border-radius: 2px;
        background-color: #0c0e14;
        image-rendering: pixelated;
      }
      #role-list .bound {
        margin-left: auto;
        color: #7d8699;
        font-size: 12px;
      }
      @media (max-width: 760px) {
        section.mode {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: 55vh auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="row modes">
      <button type="button" id="mode-level">Level</button>
      <button type="button" id="mode-skin">Skin</button>
      <button type="button" id="mode-colors">Colours</button>
      <span class="publish">
        <input id="level-name" type="text" placeholder="level name" />
        <button type="button" id="publish">Export to levels/</button>
      </span>
      <button type="button" id="clear-storage" class="danger">
        Clear storage
      </button>
    </div>
    <div class="report" id="publish-report"></div>

    <section class="mode" id="level-mode">
      <main>
        <div class="row" id="brushes">
          <button type="button" data-brush="wall">
            <span class="swatch" style="background: #4b5570"></span>1 wall
          </button>
          <button type="button" data-brush="floor">
            <span class="swatch" style="background: #262b38"></span>2 floor
          </button>
          <button type="button" data-brush="goal">
            <span class="swatch" style="background: #6d5a3f"></span>3 goal
          </button>
          <button type="button" data-brush="box">
            <span class="swatch" style="background: #c08552"></span>4 box
          </button>
          <button type="button" data-brush="player">
            <span class="swatch" style="background: #63a8e0"></span>5 player
          </button>
        </div>
        <div class="board-view" id="grid-view">
          <canvas class="board" id="grid"></canvas>
        </div>
        <div class="row">
          <label for="width">w</label>
          <input id="width" type="number" />
          <label for="height">h</label>
          <input id="height" type="number" />
          <button type="button" id="new">New</button>
          <button type="button" id="undo">Undo (Z)</button>
          <span class="zoom">
            <span>zoom</span>
            <button type="button" id="grid-zoom-out" title="Zoom out">−</button>
            <span class="zoom-level" id="grid-zoom-level">fit</span>
            <button
              type="button"
              id="grid-zoom-in"
              title="Zoom in (or ctrl + wheel)"
            >
              +
            </button>
          </span>
        </div>
      </main>
      <aside>
        <h2>Status</h2>
        <div class="report" id="report"></div>
        <h2>XSB</h2>
        <textarea
          id="xsb"
          spellcheck="false"
          placeholder="Paste XSB here, then Load"
        ></textarea>
        <div class="row">
          <button type="button" id="load">Load</button>
          <button type="button" id="export">Export</button>
        </div>
      </aside>
    </section>

    <section class="mode" id="skin-mode" hidden>
      <main>
        <h2>Preview — the level from level mode</h2>
        <div class="row" id="preview-tools">
          <button
            type="button"
            data-tool="bind"
            title="Click a cell to give its role the selected tile"
          >
            1 bind role
          </button>
          <button
            type="button"
            data-tool="place"
            title="Click or drag to put the selected tile on single cells"
          >
            2 place tile
          </button>
          <button
            type="button"
            data-tool="erase"
            title="Click or drag to take placed tiles off again"
          >
            3 erase tile
          </button>
          <button
            type="button"
            data-tool="swap"
            title="Click or drag over placed tiles to flip on top ⇄ overwrite, leaving the tile alone"
          >
            4 swap mode
          </button>
          <button
            type="button"
            data-tool="recolor"
            title="Click or drag over placed tiles to paint them with the current ink, leaving the tile and its mode alone"
          >
            5 recolor
          </button>
        </div>
        <div class="row" id="preview-options">
          <span class="caption">new tile</span>
          <button
            type="button"
            data-place-mode="onTop"
            title="The skin still draws under the placed tile, so transparency shows it through"
          >
            on top
          </button>
          <button
            type="button"
            data-place-mode="overwrite"
            title="The skin does not draw at all on that cell, so transparency is a hole"
          >
            overwrite
          </button>
          <span class="shows">
            <label for="show-skin-tiles">
              <input id="show-skin-tiles" type="checkbox" checked />
              skin tiles
            </label>
            <label for="show-custom-tiles">
              <input id="show-custom-tiles" type="checkbox" checked />
              custom tiles
            </label>
          </span>
        </div>
        <div class="board-view" id="skin-preview-view">
          <canvas class="board" id="skin-preview"></canvas>
        </div>
        <div class="row">
          <span class="zoom">
            <span>zoom</span>
            <button type="button" id="preview-zoom-out" title="Zoom out">
              −
            </button>
            <span class="zoom-level" id="preview-zoom-level">fit</span>
            <button
              type="button"
              id="preview-zoom-in"
              title="Zoom in (or ctrl + wheel)"
            >
              +
            </button>
          </span>
        </div>
      </main>
      <aside>
        <h2>Tile sheet</h2>
        <input id="sheet-file" type="file" accept="image/*" />
        <div class="row">
          <label for="tile-width">tile w</label>
          <input id="tile-width" type="number" min="1" />
          <label for="tile-height">h</label>
          <input id="tile-height" type="number" min="1" />
        </div>
        <div class="row">
          <label for="sheet-margin">margin</label>
          <input id="sheet-margin" type="number" min="0" />
          <label for="sheet-spacing">spacing</label>
          <input id="sheet-spacing" type="number" min="0" />
        </div>
        <div id="palette-view">
          <canvas id="sheet-palette"></canvas>
        </div>
        <div class="row">
          <label for="pixelated">
            <input id="pixelated" type="checkbox" checked />
            pixel art
          </label>
          <span>zoom</span>
          <button type="button" id="zoom-out" title="Zoom out">−</button>
          <span class="zoom-level" id="zoom-level">fit</span>
          <button type="button" id="zoom-in" title="Zoom in (or ctrl + wheel)">
            +
          </button>
        </div>
        <div class="row" id="ink">
          <label for="ink-color">ink</label>
          <input id="ink-color" type="color" value="#ffffff" />
          <input
            id="ink-hex"
            class="hex"
            type="text"
            spellcheck="false"
            placeholder="#rrggbb"
            aria-label="ink hex"
          />
          <button
            type="button"
            class="swatch-action"
            id="ink-copy"
            title="Copy the ink hex"
          >
            ⧉
          </button>
          <button
            type="button"
            data-ink-mode="multiply"
            title="Keeps the tile's own shading and darkens it toward the colour — white changes nothing, and nothing gets brighter"
          >
            multiply
          </button>
          <button
            type="button"
            data-ink-mode="flat"
            title="Keeps only the tile's shape and repaints every pixel it has — the full gamut, and what a monochrome stencil wants"
          >
            flat
          </button>
        </div>
        <div class="row" id="ground">
          <label for="ground-color">ground</label>
          <input id="ground-color" type="color" value="#000000" />
          <input
            id="ground-hex"
            class="hex"
            type="text"
            spellcheck="false"
            placeholder="none"
            aria-label="ground hex"
          />
          <button
            type="button"
            class="swatch-action"
            id="ground-copy"
            title="Copy the ground hex"
          >
            ⧉
          </button>
          <button
            type="button"
            class="clear"
            id="ground-clear"
            title="Draw the level onto nothing again, so it keeps its silhouette against the page"
          >
            ×
          </button>
        </div>

        <h2>Colour palette</h2>
        <div class="report" id="skin-palette-report"></div>
        <select id="skin-palette" aria-label="colour palette"></select>
        <div class="swatches" id="skin-palette-swatches"></div>

        <h2>Roles</h2>
        <div class="report" id="skin-report"></div>
        <div id="role-list"></div>

        <h2>Export</h2>
        <div class="row">
          <label for="skin-name">name</label>
          <input id="skin-name" type="text" value="untitled" />
        </div>
        <div class="row">
          <button type="button" id="export-atlas">atlas.png</button>
          <button type="button" id="export-manifest">skin.json</button>
        </div>
      </aside>
    </section>

    <section class="mode" id="colors-mode" hidden>
      <main>
        <div class="row" id="palette-name-row">
          <label for="palette-name">palette</label>
          <input
            id="palette-name"
            type="text"
            placeholder="palette name"
            aria-label="palette name"
          />
          <button
            type="button"
            class="clear"
            id="palette-delete"
            title="Delete this palette — palettes are not on the undo stack"
          >
            ×
          </button>
        </div>
        <div class="swatches" id="palette-swatches"></div>
        <div class="row" id="color-controls">
          <label for="color-picker">colour</label>
          <input id="color-picker" type="color" value="#ffffff" />
          <input
            id="color-hex"
            class="hex"
            type="text"
            spellcheck="false"
            placeholder="#rrggbb"
            aria-label="colour hex"
          />
          <button type="button" id="color-add" title="Add it to this palette">
            add
          </button>
          <button
            type="button"
            id="color-replace"
            title="Make the selected swatch this colour, keeping its place"
          >
            replace
          </button>
          <button
            type="button"
            id="colors-copy"
            title="Copy every hex in this palette, one per line"
          >
            copy all
          </button>
        </div>
      </main>
      <aside>
        <h2>Palettes</h2>
        <div class="report" id="colors-report"></div>
        <div class="row">
          <input
            id="new-palette-name"
            type="text"
            placeholder="new palette name"
            aria-label="new palette name"
          />
          <button type="button" id="palette-new">New</button>
        </div>
        <div id="palette-list"></div>

        <h2>Hex</h2>
        <textarea
          id="palette-paste"
          spellcheck="false"
          placeholder="Paste hex colours here — #1a1c2c, 5d275d, one per line, a CSS block, anything"
        ></textarea>
        <div class="row">
          <button
            type="button"
            id="palette-paste-add"
            title="Read every hex in the box into this palette, skipping the ones it already has"
          >
            Add to palette
          </button>
          <button
            type="button"
            id="palette-paste-fill"
            title="Write this palette's hexes into the box, to select by hand"
          >
            Write hexes
          </button>
        </div>
      </aside>
    </section>

    <script type="module" src="/src/editor/index.ts"></script>
  </body>
</html>
